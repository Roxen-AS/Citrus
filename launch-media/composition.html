<!doctype html><html lang="en"><meta charset="utf-8"><title>Citrus launch media compositor</title><style>html,body{margin:0;background:#f7f5f2}canvas{display:block}</style><canvas id="stage"></canvas><script>
// Editorial composition only. Every application window is an unretouched native export.
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const assets={},ink='#252C27',sage='#E4EBDD',cream='#F7F5F2',orange='#EE6426';
const load=(key,url)=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{assets[key]=image;resolve()};image.onerror=()=>reject(new Error('Missing '+url));image.src=url});
const expo=x=>x<=0?0:x>=1?1:1-Math.pow(2,-10*x),clamp=x=>Math.min(1,Math.max(0,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fill(c){ctx.fillStyle=c;ctx.fillRect(0,0,1920,viewH)}
function text(value,x,y,size=40,color=ink,weight=500,align='left'){ctx.font=`${weight} ${size}px Inter`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(value,x,y)}
function lines(value,x,y,size=88,color=ink,weight=600,leading=1.08){value.split('\n').forEach((line,index)=>text(line,x,y+index*size*leading,size,color,weight))}
function image(key,x,y,w,h,{radius=0,cover=false,shadow=false,alpha=1}={}){const source=assets[key];if(!source)throw new Error('Unknown image '+key);h??=w*source.height/source.width;ctx.save();ctx.globalAlpha=alpha;if(shadow){ctx.shadowColor='rgba(27,43,27,.17)';ctx.shadowBlur=42;ctx.shadowOffsetY=22;}if(radius){rounded(x,y,w,h,radius);ctx.clip();}if(cover){const scale=Math.max(w/source.width,h/source.height),sw=w/scale,sh=h/scale;ctx.drawImage(source,(source.width-sw)/2,(source.height-sh)/2,sw,sh,x,y,w,h)}else ctx.drawImage(source,x,y,w,h);ctx.restore();return h}
function native(key,x,y,w,alpha=1){const source=assets[key],h=w*source.height/source.width;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='rgba(26,39,29,.17)';ctx.shadowBlur=38;ctx.shadowOffsetY=20;ctx.drawImage(source,x,y,w,h);ctx.restore();return h}
function brand(x,y,size=44){image('mark',x,y-45,56,56);text('Citrus',x+72,y,size,ink,600)}
function footer(extra='Edited demonstration · Current native interface · Sample files'){text(extra,120,viewH-37,21,'#455548',450)}
function cursor(x,y){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,34);ctx.lineTo(9,25);ctx.lineTo(16,41);ctx.lineTo(23,38);ctx.lineTo(16,23);ctx.lineTo(29,23);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#26362B';ctx.lineWidth=2.4;ctx.stroke();ctx.restore()}
function photoPanel(x,y,w,h,t=0){image('photo',x,y,w,h,{cover:true,radius:18});ctx.save();rounded(x,y,w,h,18);ctx.clip();const zoom=1+Math.min(t,5)*.003;image('photo',x-w*(zoom-1)/2,y-h*(zoom-1)/2,w*zoom,h*zoom,{cover:true});ctx.restore()}
let viewH=1080;
function hero(){fill(cream);photoPanel(110,115,950,665);native('image-after',1050,115,730);native('wheel-1',392,410,570);text('A little wheel. A lot less busywork.',125,viewH-110,46,ink,600);text('Windows preview · Sample files',125,viewH-61,24,'#455548',450)}
function imageStill(){fill(sage);image('background-output',110,130,880,620,{cover:false,shadow:true});native('background-after',1060,90,740);text('Make the edit you need.',120,viewH-165,58,ink,600);text('A little framing. A separate output file.',122,viewH-112,29,'#455548',450);footer('Current native interface · Original photo and independently reopened output')}
function videoStill(){fill(cream);native('video-after',320,58,1280);footer('Current native Trim Video editor · Sample clip')}
function intro(t){fill(cream);photoPanel(1030,0,890,viewH,t);brand(120,150,48);const travel=28*(1-expo(clamp(t/1.2)));lines('Convert files.\nKeep your flow.',120,427+travel,100,ink,600,1.08);text('Citrus for Windows',124,727,35,ink,500);text('Preview · Local file conversion and focused editing',124,783,25,'#455548',450);footer('Edited product demonstration · Sample files')}
function wheelScene(t,clip=false){fill(sage);brand(120,140,43);lines(clip?'Drag. Tap Shift.\nChoose a format.':'Choose a format.\nKeep moving.',120,365,76,ink,600,1.13);text('Your original stays put.',124,610,31,'#455548',450);const x=1160,y=clip?230:185,w=575;let phase=t<1.2?0:t<3.8?1:t<5?6:1;native('wheel-'+phase,x,y,w);let start=t<1.2?0:t<3.8?0:t<5?1:6,end=phase;const transition=t<1.2?1:t<3.8?clamp((t-1.2)/.65):t<5?clamp((t-3.8)/.65):clamp((t-5)/.65);const point=index=>({x:x+w/2+Math.sin(index*Math.PI*2/7)*184,y:y+287-Math.cos(index*Math.PI*2/7)*184});let a=point(start),b=point(end),ease=smooth(transition);cursor(a.x+(b.x-a.x)*ease,a.y+(b.y-a.y)*ease);if(t>5.9){const f=expo(clamp((t-5.9)/.6));ctx.save();ctx.globalAlpha=f;text('PNG → WEBP',124,724,42,ink,600);text('A real converted copy. Reopened and checked.',124,776,25,'#455548',450);ctx.restore()}footer('Edited native-render demonstration · Not a live Explorer recording')}
function imageScene(t){fill(cream);lines('Small edits.\nClear results.',120,245,80,ink,600,1.1);text('Adjust a photo or add a background.',123,470,30,'#455548',450);const output=t<2.3?'photo':t<4?'image-output':'background-output';image(output,120,535,865,443,{cover:false,shadow:true});native(t<4?'image-after':'background-after',1110,85,690);footer()}
function videoFrame(t){if(t<1.3)return'video-before';if(t<3.2)return'trim-handle-'+String(Math.min(12,Math.floor((t-1.3)/1.9*13))).padStart(2,'0');if(t<3.9)return'video-after';return'playback-'+String(Math.min(41,Math.floor((t-3.9)/4.1*42))).padStart(2,'0')}
function trimScene(t,clip=false){fill(cream);if(clip){native(videoFrame(t),330,70,1260);footer('Edited native-render demonstration · Actual processed playback · Sample clip')}else{lines('Drag a handle.\nKeep the good bit.',120,340,72,ink,600,1.12);text('A simple timeline. A playable preview.',123,574,28,'#455548',450);native(videoFrame(t),810,105,1010);footer()} }
function closing(t){fill(sage);brand(120,160,50);lines('A better format.\nA smaller task.\nA little more flow.',120,380,77,ink,600,1.12);rounded(122,740,515,84,16);ctx.fillStyle=orange;ctx.fill();text('Download for Windows',379,795,32,'#fff',600,'center');text('Preview · Windows x64',124,877,25,'#455548',450);text('citrous.app',124,942,31,ink,500);native('background-after',1095,87,690);footer('Edited product demonstration · See release notes and system requirements')}
function film(t){if(t<2.8)wheelScene(1.2+t/2.8*6.6);else if(t<5.2)imageScene(2.3+(t-2.8)/2.4*3.7);else if(t<8.1)trimScene((t-5.2)/2.9*8);else closing(t-8.1)}
function social(){fill(cream);brand(65,100,39);lines('Convert files.\nKeep your flow.',65,260,73,ink,600,1.1);text('Preview for Windows',68,465,27,'#455548',500);native('wheel-1',690,240,350);native('image-after',1110,110,650);}
window.ready=(async()=>{await Promise.all([new FontFace('Inter','url(/font/InterDisplay-Regular.woff2)',{weight:'400'}).load().then(font=>document.fonts.add(font)),new FontFace('Inter','url(/font/InterDisplay-Medium.woff2)',{weight:'500'}).load().then(font=>document.fonts.add(font)),new FontFace('Inter','url(/font/InterDisplay-SemiBold.woff2)',{weight:'600'}).load().then(font=>document.fonts.add(font))]);let names=['image-before','image-after','background-before','background-after','video-before','video-after'];for(let i=0;i<7;i++)names.push('wheel-'+i);for(let i=0;i<=12;i++)names.push('trim-handle-'+String(i).padStart(2,'0'));for(let i=0;i<42;i++)names.push('playback-'+String(i).padStart(2,'0'));await Promise.all([load('photo','/source/citrus-garden.png'),load('mark','/brand/logo-128.png'),load('image-output','/native/image-output.png'),load('background-output','/native/background-output.png'),...names.map(name=>load(name,'/native/'+name+'.png'))]);return true})();
window.renderFrame=(kind,t=0,width=1920,height=1080)=>{canvas.width=width;canvas.height=height;viewH=height/(width/1920);ctx.setTransform(width/1920,0,0,width/1920,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';({hero,imageStill,videoStill,film,wheelScene:()=>wheelScene(t,true),trimScene:()=>trimScene(t,true),social}[kind]||film)(t)};
</script></html>
