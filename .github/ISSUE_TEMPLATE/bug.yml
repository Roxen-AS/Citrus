name: Bug report
description: Report a reproducible Citrus problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Citrus version
      placeholder: 0.3.0-preview.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows build and display scale
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Include file type/codec and held buttons or modifiers when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional non-sensitive sample or reviewed log
      description: Do not upload private originals, credentials or unredacted desktop captures.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and preview notes, and removed sensitive information.
          required: true
